<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wash" id="wash" aria-hidden="true"></div>

  <main class="page">
    <header class="masthead">
      <h1>Emotion Reader</h1>
      <p>Type a line, see the feeling underneath it.</p>
    </header>

    <div class="split">
      <section class="pane pane-input">
        <label for="textInput" class="prompt">What's on your mind?</label>
        <textarea id="textInput" rows="6" placeholder="Write a sentence or two..."></textarea>
        <button id="analyzeBtn">Analyze</button>
        <p id="errorText" class="error hidden"></p>
      </section>

      <section class="pane pane-result">
        <div id="emptyState" class="empty-state">
          <p>Your result will appear here.</p>
        </div>

        <div id="result" class="result hidden">
          <p class="result-label">This reads as</p>
          <h2 id="emotionText">—</h2>
          <p id="confidenceText" class="confidence"></p>
          <div id="scoreBars" class="score-bars"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
